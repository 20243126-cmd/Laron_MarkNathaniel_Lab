<div class="cart">
  <h2>Shopping Cart</h2>

  @for (item of menuService.cart(); track $index) {
    <div class="cart-item">
      <span>{{ item.name }}</span>
      <span>₱{{ item.price }}</span>
    </div>
  } @empty {
    <p>Cart is empty.</p>
  }

  <hr>

  <h3>Total: ₱{{ menuService.totalPrice() }}</h3>

  <button (click)="menuService.clearCart()">
    Checkout / Clear
  </button>
</div>
